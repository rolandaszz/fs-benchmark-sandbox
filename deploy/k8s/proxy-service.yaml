apiVersion: v1
kind: Service
metadata:
  name: vfs-connect-proxy
  namespace: vfs-system
  labels:
    app.kubernetes.io/name: vfs-connect-proxy
spec:
  type: ClusterIP
  appProtocol: kubernetes.io/h2c
  selector:
    app.kubernetes.io/name: vfs-connect-proxy
  ports:
    - name: h2c
      port: 8080
      targetPort: h2c
      protocol: TCP
