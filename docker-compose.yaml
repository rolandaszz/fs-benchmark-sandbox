name: fs-benchmark-sandbox

services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: vfs-pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpassword}
      POSTGRES_DB: ${POSTGRES_DB:-vfs_benchmark}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "hnsw.iterative_scan=relaxed_order"
    cpus: 4.0
    mem_limit: 4g
    memswap_limit: 4g
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./solution/engine_adapters/pgvector/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pguser} -d ${POSTGRES_DB:-vfs_benchmark}"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    networks:
      - vfs_bench_net

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: vfs-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    cpus: 4.0
    mem_limit: 4g
    memswap_limit: 4g
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    networks:
      - vfs_bench_net

  vespa:
    image: vespaengine/vespa-generic-intel-x86_64:latest
    container_name: vfs-vespa
    hostname: vespa
    restart: unless-stopped
    profiles:
      - vespa
    ports:
      - "8081:8080"
      - "19071:19071"
    cpus: 4.0
    mem_limit: 4g
    memswap_limit: 4g
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G
    volumes:
      - vespa_data:/opt/vespa/var
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:19071/state/v1/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 25
      start_period: 10s
    networks:
      - vfs_bench_net

  milvus:
    image: milvusdb/milvus:v2.5.27
    container_name: vfs-milvus
    hostname: milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: "/var/lib/milvus/etcd"
      COMMON_STORAGETYPE: "local"
      KNOWHERE_SIMD_TYPE: "sse4_2"
    cpus: 4.0
    mem_limit: 4g
    memswap_limit: 4g
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G
    volumes:
      - milvus_data:/var/lib/milvus
      - ./solution/engine_adapters/milvus/milvus.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9091/healthz || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 25
      start_period: 15s
    networks:
      - vfs_bench_net

  proxy:
    build:
      context: .
      dockerfile: solution/proxy/Dockerfile
    container_name: vfs-proxy
    hostname: proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PROXY_LISTEN_ADDR: ":8080"
      DEFAULT_TARGET_ENGINE: "pgvector"
      PGVECTOR_DSN: "postgres://${POSTGRES_USER:-pguser}:${POSTGRES_PASSWORD:-pgpassword}@pgvector:5432/${POSTGRES_DB:-vfs_benchmark}?sslmode=disable"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_GRPC_URL: "http://qdrant:6334"
      VESPA_URL: "http://vespa:8080"
      VESPA_CONFIG_URL: "http://vespa:19071"
      MILVUS_URL: "http://milvus:19530"
    cpus: 2.0
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    depends_on:
      pgvector:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    networks:
      vfs_bench_net:
        aliases:
          - proxy

  prometheus:
    image: prom/prometheus:latest
    container_name: vfs-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
    cpus: 0.5
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    networks:
      - vfs_bench_net

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: vfs-temporal
    profiles:
      - temporal
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-pgpassword}
      POSTGRES_SEEDS: pgvector
    cpus: 1.0
    mem_limit: 1g
    depends_on:
      pgvector:
        condition: service_healthy
    networks:
      - vfs_bench_net

networks:
  vfs_bench_net:
    driver: bridge

volumes:
  pgvector_data:
  qdrant_data:
  vespa_data:
  milvus_data:
  prometheus_data:
