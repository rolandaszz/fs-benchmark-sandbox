global:
  scrape_interval: 1s
  evaluation_interval: 1s
  scrape_timeout: 900ms
  external_labels:
    environment: sandbox
    service: vfs-benchmark

scrape_configs:
  - job_name: "vfs-connect-proxy"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "proxy:8080"
        labels:
          component: connectrpc-proxy
          sla_p99_seconds: "0.025"
    # Enforces retention of vfs_request_duration_seconds with explicit bucket bounds:
    # [0.0005, 0.001, 0.0025, 0.005, 0.010, 0.015, 0.020, 0.025, 0.050, 0.100, 0.250, 0.500]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "(vfs_request_duration_seconds.*|vfs_active_inflight_requests|go_.*|process_.*|promhttp_.*)"
        action: keep
